name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck + lint + format + tests
        run: npm run check
      - name: upload failure telemetry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            /tmp/vitest*.log
          if-no-files-found: ignore
