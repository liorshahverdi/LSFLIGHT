name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: typecheck + lint + format + tests + production build + browser tests
        run: npm run check
      - name: upload failure telemetry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
